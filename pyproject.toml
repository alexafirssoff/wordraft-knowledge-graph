[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "wordraft-graph"
version = "1.0.0rc1"
description = "Локальный редакторский граф с проверяемым происхождением правил"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[project.scripts]
wordraft = "wordraft.cli:main"
[tool.setuptools.packages.find]
include = ["wordraft*"]
