name: Проверка Wordraft
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Зависимости
        run: python -m pip install -e '.[test]'
      - name: Целостность графа
        run: python -m wordraft validate
      - name: Тесты
        run: python -m pytest tests -q
      - name: Проверка приватной сборки
        run: python -m wordraft release-check --profile private
